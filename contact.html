<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Rocco Holdings LLC</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0b;
      --bg-elevated: #111113;
      --text-primary: #ece8e1;
      --text-secondary: #8d8a86;
      --text-tertiary: #5c5a58;
      --brass: #ad8a55;
      --brass-dim: #6e5a3c;
      --border: rgba(236, 232, 225, 0.08);
      --border-strong: rgba(236, 232, 225, 0.16);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 2.5rem;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      padding: 2.25rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .wordmark-small {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      text-decoration: none;
    }

    .back-btn {
      padding: 0.65rem 1.5rem;
      background-color: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-block;
      transition: border-color 0.3s ease, color 0.3s ease;
    }

    .back-btn:hover {
      border-color: var(--brass);
      color: var(--brass);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 0;
      animation: rise 1.1s ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-block {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 0.01em;
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 15px;
      font-weight: 300;
      color: var(--text-secondary);
      max-width: 420px;
      margin: 0 auto;
    }

    form {
      max-width: 460px;
      margin: 0 auto;
      width: 100%;
    }

    .form-group {
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 0.6rem;
    }

    input,
    textarea {
      width: 100%;
      padding: 0.85rem 0;
      border: none;
      border-bottom: 1px solid var(--border-strong);
      border-radius: 0;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      background-color: transparent;
      color: var(--text-primary);
      transition: border-color 0.3s ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-bottom-color: var(--brass);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-tertiary);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    button {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--text-primary);
      color: var(--bg);
      border: none;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 0.5rem;
    }

    button:hover {
      background-color: var(--brass);
      color: var(--bg);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .form-status {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 13px;
      min-height: 20px;
      color: var(--text-secondary);
    }

    .form-status.success {
      color: var(--brass);
    }

    .form-status.error {
      color: #c0796a;
    }

    footer {
      padding: 2.5rem 0;
      text-align: center;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .location {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .copyright {
      font-size: 11px;
      color: var(--text-tertiary);
      opacity: 0.6;
    }

    @media (max-width: 640px) {
      .container {
        padding: 0 1.5rem;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html" class="wordmark-small">RH</a>
      <a href="index.html" class="back-btn">Back</a>
    </nav>

    <main>
      <div class="header-block">
        <p class="eyebrow">Get in touch</p>
        <h1>Submit an inquiry</h1>
        <p class="subtitle">For partnership, advisory, or venture inquiries, send us a note below.</p>
      </div>

      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
        <div class="form-status" id="formStatus"></div>
      </form>
    </main>

    <footer>
      <p class="location">Los Angeles, California</p>
      <p class="copyright">Rocco Holdings LLC</p>
    </footer>
  </div>
  <script>
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const formStatus = document.getElementById('formStatus');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      submitBtn.disabled = true;
      formStatus.textContent = 'Sending...';
      formStatus.className = 'form-status';

      try {
        const response = await fetch('https://formsubmit.co/ajax/leeadnakash@gmail.com', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            name: name,
            email: email,
            message: message,
            _subject: `New inquiry from ${name}`,
            _captcha: 'false',
            _cc: 'leo@roccoholdingsllc.com'
          })
        });

        if (response.ok) {
          formStatus.textContent = 'Message sent. We will be in touch soon.';
          formStatus.className = 'form-status success';
          form.reset();
        } else {
          throw new Error('Failed to send');
        }
      } catch (error) {
        formStatus.textContent = 'Error sending message. Please email leo@roccoholdingsllc.com directly.';
        formStatus.className = 'form-status error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
